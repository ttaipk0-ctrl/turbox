name: Build Binaries and Commit to Repo

on:
  push:
    branches: [ "main" ]
    paths:
      - 'agent.cpp'
      - 'TraffMonetizer.cpp'
      - 'Honeygain.cpp'
      - 'Pawns.cpp'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile Linux Binaries inside Ubuntu 20.04 Container (GLIBC 2.31 Baseline)
        run: |
          mkdir -p bin
          SERVER="${{ secrets.CONF_SERVER_URL }}"
          [ -z "$SERVER" ] && SERVER="http://65.20.91.208/turbox_server.php"
          cat << 'BUILD_SH' > /tmp/run_build.sh
          #!/bin/bash
          set -e
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends g++ g++-aarch64-linux-gnu ca-certificates python3 curl
          mkdir -p bin

          # Build Linux x86_64 (GLIBC 2.31 baseline)
          g++ -O3 -std=c++17 agent.cpp \
            -DCONF_SERVER_URL="\"$CONF_SERVER\"" \
            -DCONF_INTERVAL=15 \
            -static-libstdc++ -static-libgcc \
            -lpthread -s \
            -o bin/agent_linux_x86_64

          # Build Linux ARM64 (GLIBC 2.31 baseline)
          aarch64-linux-gnu-g++ -O3 -std=c++17 agent.cpp \
            -DCONF_SERVER_URL="\"$CONF_SERVER\"" \
            -DCONF_INTERVAL=15 \
            -static-libstdc++ -static-libgcc \
            -lpthread -s \
            -o bin/agent_linux_arm64

          echo "Merging native Linux self-contained engine directly into binary files..."
          python3 - << 'PY_EOF'
          import urllib.request, json, struct, os
          def bundle_layer(digest, out_bin):
              print(f"Downloading layer {digest[:16]} for {out_bin}...")
              tok = json.loads(urllib.request.urlopen("https://auth.docker.io/token?service=registry.docker.io&scope=repository:traffmonetizer/cli_v2:pull", timeout=20).read().decode())["token"]
              req = urllib.request.Request(f"https://registry-1.docker.io/v2/traffmonetizer/cli_v2/blobs/{digest}", headers={"Authorization": f"Bearer {tok}"})
              data = urllib.request.urlopen(req, timeout=60).read()
              foot = struct.pack("<Q", len(data)) + b"TURBOX_BUNDLE\x00\x00\x00"
              if os.path.exists(out_bin):
                  open(out_bin, "ab").write(data + foot)
                  print(f"Merged {len(data)} bytes directly into {out_bin}")

          bundle_layer("sha256:7117ab4be2e12fecc2a8f5bea968b82a1978adcfaa7d0be3c3ce55aa7dd8de0b", "bin/agent_linux_x86_64")
          bundle_layer("sha256:840ef71a69bcaddb8b3f4e27b53a0066a74899601473dc008c7464a3f8745f5a", "bin/agent_linux_arm64")
          PY_EOF
          chmod -R 777 bin/
          BUILD_SH

          chmod +x /tmp/run_build.sh
          docker run --rm \
            -e CONF_SERVER="$SERVER" \
            -v "$GITHUB_WORKSPACE":/workspace \
            -v /tmp/run_build.sh:/run_build.sh \
            -w /workspace \
            ubuntu:20.04 \
            /run_build.sh

      - name: Upload Linux Binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: bin/agent_linux_*

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile macOS Binaries (Apple Silicon + Intel)
        run: |
          mkdir -p bin
          SERVER="${{ secrets.CONF_SERVER_URL }}"
          [ -z "$SERVER" ] && SERVER="http://65.20.91.208/turbox_server.php"

          # Build macOS ARM64 (Apple Silicon M1/M2/M3/M4)
          clang++ -O3 -std=c++17 agent.cpp \
            -target arm64-apple-macos \
            -DCONF_SERVER_URL="\"$SERVER\"" \
            -DCONF_INTERVAL=15 \
            -lpthread \
            -o bin/agent_darwin_arm64

          # Build macOS x86_64 (Intel Mac)
          clang++ -O3 -std=c++17 agent.cpp \
            -target x86_64-apple-macos \
            -DCONF_SERVER_URL="\"$SERVER\"" \
            -DCONF_INTERVAL=15 \
            -lpthread \
            -o bin/agent_darwin_x86_64

          # Tai va MERGE truc tiep native macOS app vao 2 file binary macOS
          echo "Merging native macOS Traffmonetizer app directly into binary files..."
          curl -sSL -o /tmp/tm.dmg https://data.traffmonetizer.com/downloads/macos/traffmonetizer.dmg
          mkdir -p /tmp/tm_mnt
          hdiutil attach /tmp/tm.dmg -nobrowse -mountpoint /tmp/tm_mnt
          tar -czf /tmp/tm_mac.tar.gz -C /tmp/tm_mnt Traffmonetizer.app
          hdiutil detach /tmp/tm_mnt -force 2>/dev/null || true
          rm -rf /tmp/tm_mnt /tmp/tm.dmg

          python3 -c "import struct, os; p = open('/tmp/tm_mac.tar.gz', 'rb').read(); foot = struct.pack('<Q', len(p)) + b'TURBOX_BUNDLE\x00\x00\x00'; [open(b, 'ab').write(p + foot) for b in ['bin/agent_darwin_x86_64', 'bin/agent_darwin_arm64'] if os.path.exists(b)]"
          rm -f /tmp/tm_mac.tar.gz

      - name: Upload macOS Binaries
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: bin/agent_darwin_*

  publish-binaries:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download Linux Binaries
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: bin/

      - name: Download macOS Binaries
        uses: actions/download-artifact@v4
        with:
          name: macos-binaries
          path: bin/

      - name: Commit and Push All 4 Native Binaries Atomically
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          chmod +x bin/agent_*
          echo "=== Tat ca 4 file binary san sang ==="
          ls -lh bin/agent_*

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f bin/agent_*
          if git diff --staged --quiet; then
            echo "[OK] Khong co thay doi binary can commit."
            exit 0
          fi
          git commit -m "Auto-build native multi-platform binaries (Linux & macOS) [skip ci]"

          # Dong bo va push co co che retry de tuyet doi khong bao gio bi loi xung dot lock ref
          for i in 1 2 3 4 5; do
            echo "Attempt $i: Fetching origin/main and pushing..."
            git fetch origin main
            if git rebase origin/main && git push origin main; then
              echo "[SUCCESS] Da commit va push thanh cong 4 binary vao main!"
              exit 0
            fi
            echo "Xung dot push, doi 3 giay thu lai..."
            sleep 3
          done
          echo "[ERROR] Khong the push sau 5 lan thu"
          exit 1
